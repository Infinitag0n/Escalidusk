services:
  escalidusk:
    build: .
    image: escalidusk
    ports:
      - "3000:3000"
    # environment:
    #   # Switches on the backoffice at /admin (list and delete diagrams). Use a long one.
    #   ADMIN_PASSWORD: change-me-to-something-long
    #   # Needed behind a reverse proxy, so visitors are not all seen as the proxy.
    #   TRUST_PROXY: "true"
    volumes:
      - escalidusk-data:/data
    restart: unless-stopped
    # Only used by `docker compose watch`: rebuild and restart the container
    # whenever the source changes. Plain `docker compose up` ignores this.
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./server
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./index.html
        - action: rebuild
          path: ./vite.config.js
        - action: rebuild
          path: ./package.json

volumes:
  escalidusk-data:
