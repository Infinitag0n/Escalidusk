services:
  escalidusk:
    build:
      context: .
      args:
        # From .env. Baked into the image: rebuild after changing it.
        BASE_PATH: ${BASE_PATH:-}
    image: escalidusk
    # PORT in .env is the port on this machine; inside, the app is always on 3000.
    ports:
      - "${PORT:-3000}:3000"
    # Settings from .env (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
    volumes:
      - escalidusk-data:/data
    restart: unless-stopped
    # Keep at most 50 MB of this container's output: five files of 10 MB,
    # the oldest deleted as a new one starts. Without this it grows forever.
    # Takes effect when the container is created anew (`up -d` does that
    # after this file changes), not on a restart.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    # Only used by `docker compose watch`: rebuild and restart the container
    # whenever the source changes. Plain `docker compose up` ignores this.
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./server
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./index.html
        - action: rebuild
          path: ./signed-in.html
        - action: rebuild
          path: ./vite.config.js
        - action: rebuild
          path: ./package.json

volumes:
  escalidusk-data:
