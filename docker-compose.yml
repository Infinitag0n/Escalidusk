services:
  escalidusk:
    build:
      context: .
      args:
        # From .env. Baked into the image: rebuild after changing it.
        BASE_PATH: ${BASE_PATH:-}
    image: escalidusk
    # PORT in .env is the port on this machine; inside, the app is always on 3000.
    ports:
      - "${PORT:-3000}:3000"
    # Settings from .env (see .env.example).
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
    volumes:
      - escalidusk-data:/data
    restart: unless-stopped
    # Only used by `docker compose watch`: rebuild and restart the container
    # whenever the source changes. Plain `docker compose up` ignores this.
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./server
        - action: rebuild
          path: ./scripts
        - action: rebuild
          path: ./index.html
        - action: rebuild
          path: ./signed-in.html
        - action: rebuild
          path: ./vite.config.js
        - action: rebuild
          path: ./package.json

volumes:
  escalidusk-data:
